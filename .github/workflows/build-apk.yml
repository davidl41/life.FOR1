name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面上一键手动点击触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装前端依赖并构建
        run: |
          npm ci || npm install
          npm run build

      - name: 同步 Capacitor 原生代码
        run: |
          npx cap sync android

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 编译 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 安装包至 GitHub 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
