name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Node.js 22 (满足最新 Capacitor CLI 要求)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 必须安装依赖，因为 Capacitor 原生插件源码直接位于 node_modules 目录中
      - name: 安装依赖并构建 Web 产物
        run: |
          npm install
          npm run build

      - name: 同步 Capacitor 资源与原生插件
        run: |
          npx cap sync android

      - name: 修复 Linux 脚本权限与 CRLF 换行符
        run: |
          sed -i -e 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: 配置 Gradle 缓存与环境
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 安装包至 GitHub 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
