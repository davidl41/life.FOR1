name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java JDK 21 (匹配 Android 最新插件 JVM 21 要求)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装前端依赖并构建产物
        run: |
          npm install
          npm run build

      - name: 同步 Capacitor 资源到 Android
        run: |
          npx cap sync android

      - name: 自动接受 Android SDK 协议
        run: |
          yes | sdkmanager --licenses || true

      - name: 修复 Linux 脚本权限与换行符
        run: |
          sed -i -e 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: 编译 Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 安装包至 GitHub 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
